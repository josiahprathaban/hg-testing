<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shooting Game Lobby Launcher</title>
    <style>
      :root { color-scheme:light; --ink:#684b40; --panel:#fff9eb; --line:#d7b9a0; --muted:#826b60; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100dvh; color:var(--ink); font-family:"Trebuchet MS","Segoe UI",sans-serif; background:linear-gradient(#f6d9b4,#fff0c8 52%,#c2e9e7); }
      .page { width:min(460px,100%); margin:0 auto; padding:36px 16px 28px; }
      .hero { text-align:center; }
      .hero p { margin:0; color:var(--muted); font-size:.75rem; font-weight:700; }
      .hero h1 { margin:5px 0 8px; font-size:1.9rem; font-weight:850; }
      .hero span { font-size:.85rem; color:var(--muted); line-height:1.5; }
      .card { margin-top:22px; padding:22px; border:3px solid var(--line); border-radius:26px; background:var(--panel); box-shadow:0 5px 0 #bf967f; }
      .card h2 { margin:0; font-size:1.25rem; }
      .card>p { margin:7px 0 20px; color:var(--muted); font-size:.8rem; line-height:1.5; }
      .form { display:grid; gap:14px; }
      .field { display:grid; min-width:0; gap:6px; }
      .field-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
      label { font-size:.75rem; font-weight:750; }
      input,select { width:100%; min-width:0; min-height:44px; padding:10px 11px; border:2px solid #ddbea0; border-radius:13px; background:#fffdf6; color:var(--ink); font:inherit; font-size:.85rem; }
      input::placeholder { color:#9b8275; }
      input:focus,select:focus { border-color:#39b7c7; }
      :focus-visible { outline:3px solid #39b7c7; outline-offset:3px; }
      .avatar-preview { display:flex; gap:10px; align-items:center; padding:12px; border:2px solid #d99b77; border-radius:17px; background:#ffd4ac; }
      .avatar-preview__badge { display:grid; width:44px; height:44px; flex-shrink:0; place-items:center; border:2px solid #39b7c7; border-radius:13px; background:#eefcfc; color:#2998a8; font-size:.9rem; font-weight:850; }
      .avatar-preview strong { display:block; font-size:.9rem; }
      .avatar-preview span { display:block; margin-top:3px; color:var(--muted); font-size:.72rem; }
      .start { display:flex; align-items:center; justify-content:center; gap:8px; min-height:54px; margin-top:2px; border:2px solid #d9a446; border-radius:17px; background:#ffda7b; box-shadow:0 4px 0 #d9a446; color:#76512c; font:inherit; font-size:1.1rem; font-weight:850; cursor:pointer; }
      .start:hover:not(:disabled) { background:#ffe396; }
      .start:disabled { cursor:wait; background:#ffe8ad; box-shadow:none; }
      .start:disabled::before { content:""; width:17px; height:17px; border:2px solid #d9a446; border-top-color:#76512c; border-radius:50%; animation:spin .8s linear infinite; }
      .status { min-height:1.4em; margin:2px 0 0; color:var(--muted); font-size:.75rem; line-height:1.5; overflow-wrap:anywhere; text-align:center; }
      .status--error { color:#b74452; }
      .back { display:block; width:max-content; margin:22px auto 0; padding:9px 14px; border-radius:15px; background:var(--panel); color:#588b8a; font-size:.8rem; font-weight:750; text-decoration:none; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @media (max-width:360px) { .page { padding:26px 12px; } .card { padding:18px 14px; } .field-row { gap:9px; } }
      @media (prefers-reduced-motion:reduce) { .start:disabled::before { animation:none; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hero"><p>Test platform</p><h1>Shooting Game</h1><span>Choose your player and open the lobby.</span></header>
      <section class="card">
        <h2>Ready to play?</h2><p>Set up your player for the next adventure.</p>
        <form id="lobby-launch-form" class="form">
          <div class="field"><label for="playerName">Player name</label><input id="playerName" maxlength="32" required /></div>
          <div class="field-row">
            <div class="field"><label for="playerLevel">Player level</label><input id="playerLevel" type="number" min="1" max="99" value="1" required /></div>
            <div class="field"><label for="playerExperience">Current XP</label><input id="playerExperience" type="number" min="0" value="0" required /></div>
          </div>
          <div class="field-row">
            <div class="field"><label for="stageResults">Cleared stages</label><input id="stageResults" value="" placeholder="Example: 1,2" /></div>
            <div class="field"><label for="avatar">Avatar</label><select id="avatar"></select></div>
          </div>
          <div id="avatarPreview" class="avatar-preview"></div>
          <button id="launchButton" class="start" type="submit">Let's play!</button>
          <p id="status" class="status" aria-live="polite"></p>
        </form>
      </section>
      <a class="back" href="../index.html">← Back to games</a>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
